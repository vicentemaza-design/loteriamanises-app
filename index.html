<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin viewport-fit=cover: la app no se extiende bajo la barra de
         estado/Dynamic Island. El chrome físico estable de la PWA (barra
         de estado y franjas no cubiertas por contenido) se apoya en el
         azul #3B6CA8 de html/body (ver src/index.css) y en este mismo
         theme-color. Configuración validada en dispositivo real; requiere
         desinstalar y reinstalar la PWA para que un cambio aquí surta
         efecto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#3B6CA8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Lotería Manises — Administración de Loterías nº 3. Compra tus loterías online con total seguridad. Euromillones, Primitiva, Bonoloto y más." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lotería Manises" />
    <link rel="manifest" href="/manifest.json" />
    <title>Lotería Manises — Administración nº 3</title>
    <script>
      (function () {
        function getRealViewportHeight() {
          var candidates = [
            window.visualViewport ? window.visualViewport.height : 0,
            window.innerHeight || 0,
            document.documentElement ? document.documentElement.clientHeight : 0
          ].filter(Boolean);

          return Math.max.apply(null, candidates);
        }

        function setAppVh() {
          var vh = getRealViewportHeight();
          document.documentElement.style.setProperty('--app-vh', vh + 'px');
        }

        function nudgeViewport() {
          setAppVh();
          window.scrollTo(0, 0);
          document.documentElement.offsetHeight;
        }

        function stabilizeAppVh() {
          nudgeViewport();
          requestAnimationFrame(function () {
            nudgeViewport();
            requestAnimationFrame(function () {
              nudgeViewport();
            });
          });
          setTimeout(nudgeViewport, 120);
          setTimeout(nudgeViewport, 350);
        }

        stabilizeAppVh();
        window.addEventListener('load', stabilizeAppVh);
        window.addEventListener('pageshow', stabilizeAppVh);
        window.addEventListener('resize', setAppVh);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppVh);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var path = window.location.pathname;
        var isAuthRoute =
          path === '/' ||
          path === '/login' ||
          path === '/register' ||
          path.startsWith('/login/') ||
          path.startsWith('/register/');

        if (isAuthRoute) {
          document.documentElement.classList.add('auth-route');
        }
      })();
    </script>
    <!-- Auth first paint: deterministic branded web surface before React. -->
    <style>
      html.auth-route,
      html.auth-route body,
      html.auth-route #root {
        background: #0A4792 !important;
      }
      #auth-first-paint {
        display: none;
      }
      html.auth-route #auth-first-paint {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        z-index: 2147483647;
        display: block;
        box-sizing: border-box;
        background: #0A4792;
        pointer-events: none;
        opacity: 1;
        transition: opacity 300ms cubic-bezier(.22,1,.36,1);
        contain: layout paint;
      }
      html.auth-route #auth-first-paint.is-handing-off {
        opacity: 0;
      }
      html.auth-route .auth-first-brand {
        position: absolute;
        top: 6rem;
        left: 50%;
        width: 200px;
        transform: translateX(-50%);
        text-align: center;
        transition: transform 180ms cubic-bezier(.22,1,.36,1);
        will-change: transform;
      }
      html.auth-route #auth-first-paint img {
        display: block;
        width: auto;
        height: 3.5rem;
        max-width: 200px;
        margin: 0 auto;
      }
      html.auth-route .auth-first-progress {
        position: relative;
        width: 92px;
        height: 2px;
        margin: 22px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
      }
      html.auth-route .auth-first-progress::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -42%;
        width: 42%;
        border-radius: inherit;
        background: #F5C518;
        box-shadow: 0 0 10px rgba(245,197,24,0.35);
        animation: auth-progress-glide 850ms cubic-bezier(.45,0,.2,1) infinite;
      }
      @keyframes auth-progress-glide {
        0% { transform: translateX(0); }
        100% { transform: translateX(338%); }
      }
      @media (prefers-reduced-motion: reduce) {
        html.auth-route #auth-first-paint { transition: none; }
        html.auth-route .auth-first-brand { transition: none; }
        html.auth-route .auth-first-progress::after {
          left: 0;
          width: 100%;
          animation: none;
          opacity: .65;
        }
      }
    </style>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="auth-first-paint" aria-hidden="true">
      <div class="auth-first-brand">
        <img src="/assets/branding/logo-white.png" alt="" />
        <div class="auth-first-progress"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
