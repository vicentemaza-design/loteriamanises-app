<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin viewport-fit=cover: la app no se extiende bajo la barra de
         estado/Dynamic Island. El chrome físico estable de la PWA (barra
         de estado y franjas no cubiertas por contenido) se apoya en el
         azul #3B6CA8 de html/body (ver src/index.css) y en este mismo
         theme-color. Configuración validada en dispositivo real; requiere
         desinstalar y reinstalar la PWA para que un cambio aquí surta
         efecto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#3B6CA8" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Lotería Manises — Administración de Loterías nº 3. Compra tus loterías online con total seguridad. Euromillones, Primitiva, Bonoloto y más." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lotería Manises" />
    <link rel="manifest" href="/manifest.json" />
    <title>Lotería Manises — Administración nº 3</title>
    <script>
      (function () {
        function getRealViewportHeight() {
          var candidates = [
            window.visualViewport ? window.visualViewport.height : 0,
            window.innerHeight || 0,
            document.documentElement ? document.documentElement.clientHeight : 0
          ].filter(Boolean);

          return Math.max.apply(null, candidates);
        }

        function setAppVh() {
          var vh = getRealViewportHeight();
          document.documentElement.style.setProperty('--app-vh', vh + 'px');
        }

        function nudgeViewport() {
          setAppVh();
          window.scrollTo(0, 0);
          document.documentElement.offsetHeight;
        }

        function stabilizeAppVh() {
          nudgeViewport();
          requestAnimationFrame(function () {
            nudgeViewport();
            requestAnimationFrame(function () {
              nudgeViewport();
            });
          });
          setTimeout(nudgeViewport, 120);
          setTimeout(nudgeViewport, 350);
        }

        stabilizeAppVh();
        window.addEventListener('load', stabilizeAppVh);
        window.addEventListener('pageshow', stabilizeAppVh);
        window.addEventListener('resize', setAppVh);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppVh);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var path = window.location.pathname;
        var isAuthRoute =
          path === '/' ||
          path === '/login' ||
          path === '/register' ||
          path.startsWith('/login/') ||
          path.startsWith('/register/');

        if (isAuthRoute) {
          document.documentElement.classList.add('auth-route');
        }
      })();
    </script>
    <!-- Auth first paint: deterministic branded web surface before React. -->
    <style>
      html.auth-route,
      html.auth-route body,
      html.auth-route #root {
        background: #0A4792 !important;
      }
      #auth-first-paint {
        display: none;
      }
      html.auth-route #auth-first-paint {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        z-index: 2147483647;
        display: block;
        box-sizing: border-box;
        background: #0A4792;
        pointer-events: none;
        opacity: 1;
        transition: opacity 300ms cubic-bezier(.22,1,.36,1);
        contain: layout paint;
      }
      html.auth-route #auth-first-paint.is-handing-off {
        opacity: 0;
      }
      html.auth-route .auth-first-mark {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 108px;
        height: 108px;
        transform: translate(-50%, -50%);
      }
      html.auth-route .auth-first-mark img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      html.auth-route .auth-first-mark-base {
        filter: brightness(0) invert(1);
      }
      html.auth-route .auth-first-mark-fill {
        filter: brightness(0) saturate(100%) invert(82%) sepia(91%) saturate(1221%) hue-rotate(355deg) brightness(99%) contrast(94%);
        clip-path: polygon(
          0 100%, 16% 100%, 33% 100%, 50% 100%, 66% 100%, 83% 100%, 100% 100%,
          100% 100%, 0 100%
        );
        animation: auth-isotipo-liquid-fill 950ms cubic-bezier(.35,.02,.2,1) forwards;
        will-change: clip-path;
      }
      @keyframes auth-isotipo-liquid-fill {
        0% {
          clip-path: polygon(
            0 100%, 16% 100%, 33% 100%, 50% 100%, 66% 100%, 83% 100%, 100% 100%,
            100% 100%, 0 100%
          );
        }
        22% {
          clip-path: polygon(
            0 82%, 16% 78%, 33% 82%, 50% 77%, 66% 81%, 83% 78%, 100% 81%,
            100% 100%, 0 100%
          );
        }
        48% {
          clip-path: polygon(
            0 56%, 16% 51%, 33% 55%, 50% 50%, 66% 54%, 83% 50%, 100% 54%,
            100% 100%, 0 100%
          );
        }
        74% {
          clip-path: polygon(
            0 29%, 16% 24%, 33% 28%, 50% 23%, 66% 27%, 83% 23%, 100% 27%,
            100% 100%, 0 100%
          );
        }
        92% {
          clip-path: polygon(
            0 9%, 16% 5%, 33% 8%, 50% 4%, 66% 7%, 83% 4%, 100% 7%,
            100% 100%, 0 100%
          );
        }
        100% {
          clip-path: polygon(
            0 0, 16% 0, 33% 0, 50% 0, 66% 0, 83% 0, 100% 0,
            100% 100%, 0 100%
          );
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html.auth-route #auth-first-paint { transition: none; }
        html.auth-route .auth-first-mark-fill {
          animation: none;
          clip-path: polygon(
            0 0, 16% 0, 33% 0, 50% 0, 66% 0, 83% 0, 100% 0,
            100% 100%, 0 100%
          );
        }
      }
    </style>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="auth-first-paint" aria-hidden="true">
      <div class="auth-first-mark">
        <img class="auth-first-mark-base" src="/src/assets/brand/manises-isotipo.png" alt="" />
        <img class="auth-first-mark-fill" src="/src/assets/brand/manises-isotipo.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
