<!--
  ============================================================
  CABECERA COMPARTIDA — Lotería Manises
  Incluir al inicio de TODOS los emails, justo después del
  bloque HIDDEN PREHEADER.
  ============================================================
-->

<!-- Preheader bar -->
<tr>
  <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:10px 24px;text-align:center;border-bottom:1px solid #F3F4F6;">
    <p style="margin:0;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9CA3AF;">
      Si no puedes ver bien este correo,
      <a href="{{URL_VERSION_WEB}}" style="color:#1565C0;text-decoration:underline;">ábrelo en tu navegador</a>
    </p>
  </td>
</tr>

<!-- Logo header -->
<tr>
  <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:26px 24px 22px;border-bottom:2px solid #EEF2FF;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <!-- Diamantes decorativos izquierda -->
        <td width="60" valign="middle" style="vertical-align:middle;text-align:right;padding-right:10px;">
          <span style="display:block;color:#E84D5F;font-size:8px;line-height:1.4;text-align:right;">&#9670;</span>
          <span style="display:block;color:#1565C0;font-size:14px;line-height:1.2;text-align:right;">&#9670;</span>
          <span style="display:block;color:#93C5FD;font-size:6px;line-height:1.4;text-align:right;">&#9670;</span>
        </td>
        <!-- Logo centrado -->
        <td valign="middle" style="vertical-align:middle;text-align:center;">
          <!--
            REEMPLAZAR src con la URL definitiva del logo en el CDN.
            El logo debe ser la versión completa a color sobre fondo blanco.
            Tamaño real de la imagen: 400x120px (@2x para Retina).
          -->
          <img src="https://cdn.loteriamanises.com/emails/logo-manises-full.png"
               width="200" alt="Lotería Manises · Desde 2000"
               style="display:block;margin:0 auto;width:200px;max-width:200px;height:auto;border:0;" />
        </td>
        <!-- Diamantes decorativos derecha -->
        <td width="60" valign="middle" style="vertical-align:middle;text-align:left;padding-left:10px;">
          <span style="display:block;color:#22C55E;font-size:6px;line-height:1.4;text-align:left;">&#9670;</span>
          <span style="display:block;color:#1565C0;font-size:14px;line-height:1.2;text-align:left;">&#9670;</span>
          <span style="display:block;color:#F59E0B;font-size:8px;line-height:1.4;text-align:left;">&#9670;</span>
        </td>
      </tr>
    </table>
  </td>
</tr>
