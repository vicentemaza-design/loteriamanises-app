<!--
  ============================================================
  CABECERA COMPARTIDA — Lotería Manises
  Incluir al inicio de TODOS los emails, justo después del
  bloque HIDDEN PREHEADER (referencia; en la práctica cada
  template la lleva inlined, ver EMAIL-DESIGN-GUIDE.md §1).

  Patrón único de cabecera: degradado de color (nunca fondo
  blanco) + logo blanco + insignia de icono translúcida.
  Sustituye BASE/MID/TOP por uno de los 3 pares de la paleta
  de mensaje (ver EMAIL-DESIGN-GUIDE.md §2 "Paleta de cabecera"):
    Azul  → #0B2145 / #123B7A / #1565C0
    Verde → #0B3320 / #14532D / #1E7A45
    Rojo  → #7A1620 / #A81F1F / #DC2626
  Los templates `juegos-*` / `nacional-recepcion-solicitud` /
  `nacional-confirmacion-pedido` usan {{HERO_COLOR}} (color de
  marca del juego) en vez de esta paleta fija.
  ============================================================
-->

<!-- Preheader bar -->
<tr>
  <td bgcolor="BASE" style="background-color:BASE;padding:9px 24px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.10);">
    <p style="margin:0;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:11px;line-height:1.5;color:rgba(255,255,255,0.6);">
      Si no puedes ver bien este correo,
      <a href="{{URL_VERSION_WEB}}" style="color:rgba(255,255,255,0.85);text-decoration:underline;">ábrelo en tu navegador</a>
    </p>
  </td>
</tr>

<!-- Cabecera + hero: logo + insignia de icono, fondo degradado -->
<tr>
  <td bgcolor="BASE"
      style="background-color:BASE;
             background-image:linear-gradient(135deg,BASE 0%,MID 55%,TOP 100%);
             padding:0;text-align:center;">
    <!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:0;background-color:BASE;"><![endif]-->

    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="padding:28px 24px 20px;text-align:center;">
          <img src="https://cdn.loteriamanises.com/emails/logo-manises-white.png"
               width="190" alt="Lotería Manises"
               style="display:block;margin:0 auto;width:190px;height:auto;border:0;" />
        </td>
      </tr>
      <tr>
        <td style="padding:0 40px;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td style="border-top:1px solid rgba(255,255,255,0.22);font-size:1px;line-height:1px;">&nbsp;</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <!-- Insignia de icono 90x90.
         Va como UNA SOLA imagen autocontenida: el PNG ya lleva el cuadrado
         redondeado, el velo blanco al 15 % y el icono, con las esquinas en el
         canal alfa. NO se monta con una celda de color + border-radius: Outlook
         de escritorio ignora border-radius y no soporta rgba(), así que la
         insignia saldría cuadrada y de otro color.
         Las disponibles están en assets/ como icon-hero-*-square.png. Si hace
         falta una nueva, se compone el glifo sobre la misma placa de velo
         (ver EMAIL-DESIGN-GUIDE.md). -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin:0 auto 22px;border-collapse:separate !important;">
      <tr>
        <td width="90" height="90" style="width:90px;height:90px;line-height:0;font-size:0;text-align:center;">
          <img src="https://cdn.loteriamanises.com/emails/INSIGNIA_DEL_MENSAJE.png"
               width="90" height="90" alt=""
               style="display:block;width:90px;height:90px;border:0;margin:0 auto;" />
        </td>
      </tr>
    </table>

    <!-- Título + texto del hero: blanco / rgba(255,255,255,0.82), centrado o a 2 columnas según el template -->

    <!--[if mso]></td></tr></table><![endif]-->
  </td>
</tr>
